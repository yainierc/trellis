# trellis — per-repository profile
#
# The plugin is generic; everything repo-specific lives here. Copy this file to
# `.trellis/profile.yml` in the target repository and fill it in. Skills read this file instead of
# hardcoding commands, paths or branch names — that is what keeps one plugin serving every repo.

project:
  code: ~                      # short project code used in ids and resource names
  artifact_language: en        # language of every generated artifact, whatever language the
                               # conversation happens in
  # The repository's CEILING, not a per-task setting. A contract may ask for less, never for more.
  #   pr          the AI commits in its worktree and stops. Nothing pushes, merges or deploys.
  #   auto-merge  a contract a human explicitly granted autonomy to may push its task branch, open a
  #               pull request and request auto-merge. It still never merges: the decision belongs to
  #               required status checks. See docs/adr/0003-graduated-autonomy.md.
  autonomy: pr

paths:
  specs: openspec/changes      # where specs / change proposals live
  contracts: docs/contracts    # where contract files live: pending/ active/ completed/
  # Where finished contracts go, by year. Archiving is a MOVE and a location — it never changes a
  # contract's `status`, and the validator still resolves `depends_on` across the boundary so a live
  # contract may depend on one archived months ago. Run `node scripts/archive.mjs --dry-run` first.
  archive: docs/contracts/archive
  decisions: docs/adr          # decision records
  # Location convention only — nothing in the plugin reads this yet. Operational procedures live
  # here: how a feature flag gets turned off in an incident and how long that actually takes,
  # how a credential is rotated, what to look at when a queue backs up.
  runbooks: docs/runbooks
  scratch: tmp                 # gitignored; never referenced from a committed file

git:
  base_branch: main
  branch_pattern: "task/{id}-{slug}"
  # One worktree per contract, all branched from the same recorded base commit (core.md §7).
  # Created by `/trellis:fleet`; the base commit is recorded in .trellis/wave.json. Gitignore both.
  worktree_root: .trellis/worktrees
  # PR target. Set to an integration branch when a whole spec must land as one PR — and read the
  # cost first: session PRs into an integration branch get NO CI signal until the final merge.
  pr_target: main
  # Does a merge to base_branch deploy to production? REQUIRED to answer when autonomy is
  # `auto-merge`, and never inferred: `true` disqualifies this repository from autonomy entirely,
  # because auto-merge would then be auto-deploy. An unanswered `~` is also a refusal — the gate is
  # skipped while saying so, exactly like every other `~` in this file.
  deploy_on_merge: ~

commands:
  # Every command runs from the repository root. `~` means "not applicable in this repo" and the
  # gate that would use it is skipped with that stated — never silently.
  build: ~
  test_fast: ~                 # unit + architecture + build tests: must fail in under a minute
  test_slow: ~                 # integration + contract: real dependencies
  lint: ~
  format_check: ~
  typecheck: ~
  # Per-file commands, run by the PostToolUse hook on the file that was just written.
  format_file: ~               # receives the file path as its last argument
  lint_file: ~

gates:
  # The Stop gate: an executor cannot report a contract complete until all of these pass.
  stop:
    - build
    - lint
    - test_fast
    - done_when                # every criterion in the contract, re-executed
  # Required before a pull request is opened. Costs tokens, so it never runs on Stop.
  pre_pr:
    - review                   # adversarial reviewer, zero must-fix findings
    - test_slow
  # Who knows the business well enough to say "that works, but functionally it is wrong". ADVISORY
  # by default: it does not block a pull request. Domain reviewers usually see the product on a
  # staging site rather than in a diff, and a blocking gate that waits on somebody travelling stops
  # the work without catching anything a machine could not.
  #
  # It is listed here anyway, because a reviewer nobody named is a reviewer nobody asks. Per area:
  #   domain_review:
  #     web/listings: "Iver + Jessica (BA Group huddle)"
  #     billing: "Finance"
  # An area with no reviewer passes without one — stated, not silently.
  domain_review: none

concurrency:
  # How many contracts `/trellis:fleet` will launch in one wave. Read by scripts/fleet-plan.mjs.
  max_parallel: 4
  # Hard ceilings that are not about tokens — dev-server ports, CORS allow-lists, licence seats,
  # a shared test database. State them or the fleet will exceed them and the failure will look like
  # broken code. `fleet-plan.mjs` warns loudly when this is unstated, and cannot check a ceiling it
  # cannot interpret: it does not know what a seat is. `none` is a valid answer, deliberately given.
  ceilings: none

tracker:
  provider: none               # none | ado
  organization: ~
  project: ~
  # Identity used to assign work items. Resolved per developer, never hardcoded in a committed file.
  identity_source: "git config trellis.trackerIdentity"

rules:
  # Rule packs layered on top of trellis/rules. Company and stack packs install separately.
  packs: []
  # Repo-local rules, read before touching the matching area.
  local: .claude/rules

agents:
  # Which areas each role owns — "which areas Iver works on, which areas Jess works on". Allocated in
  # planning so two people never write the same files, and enforced by the write-boundary hook on top
  # of the contract's own `writes`.
  #
  # It binds only when the harness reports an agent type, which it does for subagents and not for a
  # human session. So this constrains delegated work, not the person at the keyboard.
  #   listed with paths  → may write only inside them, and only inside the contract's writes
  #   listed as []       → no restriction beyond the contract
  #   not listed at all  → writes nothing
  implementer: []              # ships with the plugin — executes one contract
  reviewer: []                 # ships with the plugin — adversarial review, artifacts only
